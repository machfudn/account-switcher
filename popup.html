<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Home: app cards -->
    <main id="view-home" class="view">
      <header class="home-header">
        <h1>Account Switcher</h1>
        <p class="home-sub">Select an app to manage</p>
      </header>
      <div id="app-cards" class="app-cards"></div>
    </main>

    <!-- Detail: account management per app -->
    <main id="view-detail" class="view hidden">
      <header class="detail-header">
        <button id="back-btn" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <div id="current-account" class="current-account">
          <span class="current-label">Active</span>
          <span id="current-name" class="current-name">No account loaded</span>
        </div>
      </header>

      <section class="section">
        <div class="section-header">
          <h2>Saved Accounts</h2>
          <span id="account-count" class="badge"></span>
        </div>
        <div id="accounts-list" class="accounts-list"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Save Session</h2>
        </div>
        <div class="save-row">
          <input type="text" id="account-name" placeholder="Account name" />
          <button id="save-btn" class="btn btn-primary">Save</button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Backup</h2>
        </div>
        <div class="backup-row">
          <button id="export-btn" class="btn btn-secondary">Export All</button>
          <button id="import-btn" class="btn btn-secondary">Import</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" class="hidden" />
      </section>

      <section class="section">
        <button id="clear-all-btn" class="btn btn-danger btn-block">Clear All Sessions</button>
      </section>
    </main>
  </div>

  <div id="export-bar" class="export-bar hidden">
    <span id="selection-count">0 selected</span>
    <button id="export-selected-btn" class="btn btn-export">Export Selected</button>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-title"></h3>
      <p id="modal-message" class="modal-message"></p>
      <input type="text" id="modal-input" class="modal-input hidden" />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-confirm" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/cookies.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
